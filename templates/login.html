<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Login - School Announcement Portal</title>

<style>
*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:Arial, Helvetica, sans-serif;
}

body{
    background:linear-gradient(135deg,#003366,#0059b3);
    height:100vh;
    display:flex;
    justify-content:center;
    align-items:center;
}

.login-container{
    width:400px;
    background:#fff;
    padding:40px;
    border-radius:15px;
    box-shadow:0 10px 30px rgba(0,0,0,0.3);
}

.login-container h1{
    text-align:center;
    color:#003366;
    margin-bottom:10px;
}

.login-container p{
    text-align:center;
    color:#666;
    margin-bottom:30px;
}

.input-group{
    margin-bottom:20px;
}

.input-group label{
    display:block;
    margin-bottom:8px;
    font-weight:bold;
    color:#003366;
}

.input-group input{
    width:100%;
    padding:12px;
    border:1px solid #ccc;
    border-radius:8px;
    font-size:16px;
}

.input-group input:focus{
    border-color:#0059b3;
    outline:none;
}
.input-group select{
    width:100%;
    padding:12px;
    border:1px solid #ccc;
    border-radius:8px;
    font-size:16px;
    background:white;
    cursor:pointer;
}

.input-group select:focus{
    border-color:#0059b3;
    outline:none;
}
.login-btn{
    width:100%;
    background:#003366;
    color:white;
    border:none;
    padding:14px;
    border-radius:8px;
    font-size:16px;
    cursor:pointer;
    transition:.3s;
}

.login-btn:hover{
    background:#0059b3;
}

.links{
    margin-top:20px;
    text-align:center;
}

.links a{
    color:#003366;
    text-decoration:none;
    font-weight:bold;
}

.links a:hover{
    text-decoration:underline;
}

.back-home{
    display:block;
    text-align:center;
    margin-top:25px;
    color:#666;
    text-decoration:none;
}

.back-home:hover{
    color:#003366;
}

.note{
    margin-top:20px;
    text-align:center;
    font-size:14px;
    color:#777;
}

@media(max-width:500px){

.login-container{
    width:90%;
    padding:30px;
}

}
</style>

</head>
<body>

<div class="login-container">

<h1>🏫 School Portal</h1>

<p>Login to your account</p>

<form action="/login" method="POST">

<div class="input-group">
<label for="email">Email Address</label>
<input
type="email"
id="email"
name="email"
placeholder="Enter your email"
autocomplete="email"
required>
</div>

<div class="input-group">
<label for="password">Password</label>
<input
type="password"
id="password"
name="password"
placeholder="Enter your password"
autocomplete="current-password"
required>
</div>

<div class="input-group">
<label for="role">Login As</label>
<select id="role" name="role" required>
    <option value="">-- Select Role --</option>
    <option value="student">🎓 Student</option>
    <option value="teacher">👨‍🏫 Teacher</option>
</select>
</div>

<button class="login-btn" type="submit">
🔐 Login
</button>

</form>
<div class="links">
<a href="/">Forgot Password?</a>
</div>

<div class="links">
<a href="/">🏠 Home</a> |
<a href="/student">Student</a> |
<a href="/teacher">Teacher</a> |
<a href="/announcement">Announcements</a> |
<a href="/contact">Contact</a>
</div>

<a href="/" class="back-home">
⬅ Back to Home
</a>

<div class="note">
Only authorized students and teachers can access this portal.
</div>

</div>

<script src="/static/script.js"></script>

</body>
</html>
